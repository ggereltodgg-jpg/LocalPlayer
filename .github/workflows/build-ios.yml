name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: LocalRapPlayer_V2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project LocalRapPlayer.xcodeproj \
            -scheme LocalRapPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/LocalRapPlayer.app"
          test -d "$APP_PATH"
          rm -rf Payload LocalRapPlayer_unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry LocalRapPlayer_unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocalRapPlayer-unsigned-IPA
          path: LocalRapPlayer_V2/LocalRapPlayer_unsigned.ipa

      - name: Upload build log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: LocalRapPlayer_V2/xcodebuild.log
          if-no-files-found: ignore
