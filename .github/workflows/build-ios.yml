name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show uploaded files
        run: |
          echo "Repository files:"
          find . -maxdepth 4 -type f | sort

      - name: Find project.yml
        shell: bash
        run: |
          SPEC=$(find "$GITHUB_WORKSPACE" -type f -name "project.yml" | head -n 1)

          if [ -z "$SPEC" ]; then
            echo "ERROR: project.yml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")

          echo "Found project.yml:"
          echo "$SPEC"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          xcodegen generate
          ls -la

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          set -o pipefail

          xcodebuild \
            -project LocalRapPlayer.xcodeproj \
            -scheme LocalRapPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          APP_PATH="build/Build/Products/Release-iphoneos/LocalRapPlayer.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App not found at:"
            echo "$APP_PATH"
            exit 1
          fi

          rm -rf Payload
          mkdir Payload

          cp -R "$APP_PATH" Payload/

          zip -qry LocalRapPlayer_unsigned.ipa Payload

          cp LocalRapPlayer_unsigned.ipa "$GITHUB_WORKSPACE/LocalRapPlayer_unsigned.ipa"

          echo "IPA created:"
          ls -lh "$GITHUB_WORKSPACE/LocalRapPlayer_unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocalRapPlayer-IPA
          path: LocalRapPlayer_unsigned.ipa

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            **/xcodebuild.log
          if-no-files-found: ignore
