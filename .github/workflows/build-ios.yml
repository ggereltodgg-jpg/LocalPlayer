name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract app source
        shell: bash
        run: |
          mkdir -p extracted

          unzip -q LocalRapPlayer_V2_GitHub_IPA_Build_FIXED.zip -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

          PROJECT_DIR="$GITHUB_WORKSPACE/extracted/LocalRapPlayer_V2"

          if [ ! -f "$PROJECT_DIR/project.yml" ]; then
            echo "ERROR: project.yml not found inside ZIP"
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/LocalRapPlayer" ]; then
            echo "ERROR: LocalRapPlayer source folder not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          xcodegen generate

          echo "Generated project:"
          ls -la

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          set -o pipefail

          xcodebuild \
            -project LocalRapPlayer.xcodeproj \
            -scheme LocalRapPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package IPA
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          APP_PATH="build/Build/Products/Release-iphoneos/LocalRapPlayer.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: LocalRapPlayer.app not found"
            exit 1
          fi

          rm -rf Payload
          mkdir Payload

          cp -R "$APP_PATH" Payload/

          zip -qry LocalRapPlayer_unsigned.ipa Payload

          cp LocalRapPlayer_unsigned.ipa \
            "$GITHUB_WORKSPACE/LocalRapPlayer_unsigned.ipa"

          ls -lh "$GITHUB_WORKSPACE/LocalRapPlayer_unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocalRapPlayer-IPA
          path: LocalRapPlayer_unsigned.ipa

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LocalRapPlayer-build-log
          path: |
            extracted/LocalRapPlayer_V2/xcodebuild.log
          if-no-files-found: ignore
